on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - download-file-create-pr

jobs:
  update-repos-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup git and switch to target branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="update-repos-csv"

          # Check if branch exists and switch to it, or create new branch
          git fetch origin --quiet
          if git rev-parse --verify origin/$BRANCH_NAME >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME exists, checking out..."
            git checkout -q $BRANCH_NAME
          else
            echo "Creating new branch $BRANCH_NAME..."
            git checkout -q -b $BRANCH_NAME
          fi

      - name: Create directory structure
        run: |
          echo "Creating directory structure: sync/files/csv"
          mkdir -p sync/files/csv

      - name: Download repos.csv
        env:
          GITHUB_TOKEN: ${{ secrets.REPOS_CSV_TOKEN }}
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "Downloading repos.csv with authentication"
            curl -sS -H "Authorization: token $GITHUB_TOKEN" -o sync/files/csv/repos.csv https://raw.githubusercontent.com/moderneinc/moderne-organizations/refs/heads/main/src/main/resources/repos.csv
          else
            echo "Downloading repos.csv without authentication"
            curl -sS -o sync/files/csv/repos.csv https://raw.githubusercontent.com/moderneinc/moderne-organizations/refs/heads/main/src/main/resources/repos.csv
          fi
          echo "Download complete"

      - name: Check for changes
        id: check_changes
        run: |
          git add sync/files/csv/repos.csv
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected!"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git commit -q -m "Update repos.csv"
          git push -q origin update-repos-csv

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head update-repos-csv --state open --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            gh pr create --title "Update repos.csv" --body "A change needs to be merged to update the organization structure" --base download-file-create-pr
            echo "PR created successfully"
          else
            echo "PR #$PR_EXISTS already exists"
          fi
