name: Moderne Analysis

on:
  pull_request

jobs:
  moderne-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK with cache
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # or 'gradle' if using Gradle

      - name: Get Moderne CLI version
        id: get-moderne-version
        run: |
          LATEST_VERSION=$(curl -s --request GET --url "https://api.github.com/repos/moderneinc/moderne-cli-releases/releases/latest" | jq '.tag_name' -r | sed "s/^v//")
          if [ -z "${LATEST_VERSION}" ]; then
            echo "Failed to get latest stable version"
            exit 1
          fi
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest Moderne CLI version: $LATEST_VERSION"

      - name: Cache Moderne CLI
        id: cache-moderne
        uses: actions/cache@v4
        with:
          path: ~/moderne-cli
          key: ${{ runner.os }}-moderne-cli-jar-${{ steps.get-moderne-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-moderne-cli-jar-

      - name: Install Moderne CLI
        if: steps.cache-moderne.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/moderne-cli
          cd ~/moderne-cli
          VERSION="${{ steps.get-moderne-version.outputs.version }}"
          echo "Downloading Moderne CLI version: ${VERSION}"
          curl -s --request GET --url "https://repo1.maven.org/maven2/io/moderne/moderne-cli/${VERSION}/moderne-cli-${VERSION}.jar" --output mod.jar

          # Create wrapper script
          cat > mod << 'EOF'
          #!/bin/bash
          java -jar ~/moderne-cli/mod.jar "$@"
          EOF
          chmod +x mod
          sudo mv mod /usr/local/bin/
          echo "Installed Moderne CLI version: ${VERSION}"

      - name: Run Moderne recipes
        id: moderne-run
        run: |
          # Run your Moderne commands here
          mod run --recipe=org.openrewrite.java.cleanup.CommonStaticAnalysis > moderne-output.txt 2>&1

          # Capture the patch/diff output
          if [ -f .moderne/patch.diff ]; then
            echo "patch_found=true" >> $GITHUB_OUTPUT
            cp .moderne/patch.diff moderne-patch.diff
          else
            echo "patch_found=false" >> $GITHUB_OUTPUT
            git diff > moderne-patch.diff
          fi

      - name: Post patch as PR comment - Option 1 (GitHub Script)
        if: steps.moderne-run.outputs.patch_found == 'true' || always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let patchContent = '';

            try {
              patchContent = fs.readFileSync('moderne-patch.diff', 'utf8');
            } catch (error) {
              patchContent = 'No changes detected or patch file not found.';
            }

            const comment = `## 🔧 Moderne Analysis Results

            <details>
            <summary>View patch/changes</summary>

            \`\`\`diff
            ${patchContent}
            \`\`\`

            </details>

            ---
            *Generated by Moderne CLI*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      # Alternative Option 2: Using peter-evans/create-or-update-comment
      # - name: Post patch as PR comment - Option 2
      #   if: steps.moderne-run.outputs.patch_found == 'true' || always()
      #   uses: peter-evans/create-or-update-comment@v4
      #   with:
      #     issue-number: ${{ github.event.pull_request.number }}
      #     body-path: moderne-patch.diff

      # Alternative Option 3: Using marocchino/sticky-pull-request-comment
      # - name: Post patch as PR comment - Option 3
      #   if: steps.moderne-run.outputs.patch_found == 'true' || always()
      #   uses: marocchino/sticky-pull-request-comment@v2
      #   with:
      #     path: moderne-patch.diff
      #     header: moderne-analysis